<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi 完全指南 · 从安装到团队流水线</title>
<style>
:root{
  --bg:#0c0e12; --bg-soft:#10141a; --panel:#12161d; --panel-2:#171c26; --panel-3:#1c2230;
  --border:#232b3a; --border-soft:#1b2230;
  --text:#e8eaf0; --text-2:#9aa3b2; --text-3:#5c6577;
  --green:#4ade80; --amber:#fbbf24; --purple:#a78bfa; --blue:#60a5fa; --red:#f87171;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;
  --sans:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.8;
  background-image:radial-gradient(1200px 500px at 70% -200px,rgba(74,222,128,.06),transparent 60%),
                   radial-gradient(900px 420px at 10% -160px,rgba(96,165,250,.05),transparent 60%);
  min-height:100vh;
}
::selection{background:rgba(74,222,128,.25)}
code,kbd,pre,.mono{font-family:var(--mono)}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 24px;
  background:rgba(12,14,18,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.logo{
  font-family:var(--mono);font-weight:700;font-size:18px;color:var(--green);
  background:linear-gradient(180deg,#141a12,#0e130e);
  border:1px solid #1f3526;border-radius:8px;padding:3px 10px;line-height:1.4;
  text-shadow:0 0 12px rgba(74,222,128,.5);
}
.brand-title{font-size:16px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--text-3);white-space:nowrap}
.mode-switch{
  display:flex;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:3px;gap:2px;
}
.mode-btn{
  font-family:var(--sans);font-size:13.5px;color:var(--text-2);
  background:transparent;border:none;border-radius:8px;padding:6px 16px;cursor:pointer;
  transition:all .18s ease;white-space:nowrap;
}
.mode-btn:hover{color:var(--text)}
.mode-btn.active{background:var(--panel-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.searchbox{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:7px 12px;min-width:260px;flex:0 1 340px;
  transition:border-color .18s ease;
}
.searchbox:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.12)}
.searchbox svg{flex:none;opacity:.55}
.searchbox input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--text);font-size:13.5px;font-family:var(--sans);
}
.searchbox input::placeholder{color:var(--text-3)}
.searchbox kbd{flex:none}
.progress-pill{
  font-family:var(--mono);font-size:12px;color:var(--text-2);
  border:1px solid var(--border);border-radius:999px;padding:5px 12px;
  background:var(--panel);white-space:nowrap;cursor:pointer;
}
.progress-pill b{color:var(--green);font-weight:600}

/* ============ 布局 ============ */
.container{max-width:1240px;margin:0 auto;padding:28px 24px 120px}
.view-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start}
@media(max-width:920px){.view-grid{grid-template-columns:1fr}.side{position:static!important}}
.side{position:sticky;top:76px}

/* ============ 学习路径：大纲 ============ */
.outline-stage{margin-bottom:20px}
.outline-stage-head{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
  font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--text-3);
}
.stage-dot{width:8px;height:8px;border-radius:50%;flex:none}
.stage-bar{flex:1;height:3px;background:var(--panel-3);border-radius:2px;overflow:hidden}
.stage-bar i{display:block;height:100%;border-radius:2px;transition:width .3s ease}
.outline-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 10px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--text-2);font-size:13.5px;cursor:pointer;
  font-family:var(--sans);transition:all .15s ease;
}
.outline-item:hover{background:var(--panel);color:var(--text)}
.outline-item.current{background:var(--panel-2);border-color:var(--border);color:var(--text)}
.outline-item .tick{
  flex:none;width:15px;height:15px;border-radius:50%;
  border:1.5px solid var(--text-3);display:grid;place-items:center;
  font-size:10px;color:transparent;transition:all .15s ease;
}
.outline-item.done .tick{background:var(--green);border-color:var(--green);color:#08130c}
.outline-item.done{color:var(--text-3)}
.outline-reset{
  margin-top:8px;width:100%;font-size:12px;color:var(--text-3);
  background:transparent;border:1px dashed var(--border);border-radius:8px;
  padding:6px;cursor:pointer;font-family:var(--sans);
}
.outline-reset:hover{color:var(--red);border-color:var(--red)}

/* ============ 学习路径：单元 ============ */
.stage-banner{
  display:flex;align-items:center;gap:14px;margin:44px 0 18px;
}
.stage-banner:first-child{margin-top:0}
.stage-num{
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;
  padding:4px 10px;border-radius:6px;border:1px solid;
}
.stage-banner h2{font-size:22px;font-weight:700;letter-spacing:.01em}
.stage-banner p{font-size:13px;color:var(--text-3);margin-left:auto;text-align:right}
.unit{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;
  padding:22px 24px;margin-bottom:16px;scroll-margin-top:84px;
  transition:border-color .2s ease;
}
.unit:hover{border-color:var(--border)}
.unit-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.unit-check{
  flex:none;margin-top:5px;width:22px;height:22px;border-radius:50%;cursor:pointer;
  border:2px solid var(--text-3);background:transparent;display:grid;place-items:center;
  color:transparent;font-size:12px;transition:all .18s ease;
}
.unit-check:hover{border-color:var(--green)}
.unit.done .unit-check{background:var(--green);border-color:var(--green);color:#08130c}
.unit.done .unit-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}
.unit-title{font-size:17px;font-weight:650}
.unit-tag{
  flex:none;margin-top:3px;font-size:11px;font-weight:700;letter-spacing:.1em;
  padding:2px 8px;border-radius:5px;
}
.tag-case{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
.tag-core{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.28)}
.unit-body{color:var(--text-2);font-size:14.5px}
.unit-body p{margin:8px 0}
.unit-body strong{color:var(--text);font-weight:600}

/* 块：提示 */
.tip,.warn{
  border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;
  display:flex;gap:10px;align-items:flex-start;line-height:1.7;
}
.tip{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.22);color:#b9d4f5}
.warn{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);color:#f0dcab}
.tip::before{content:"提示";flex:none;font-size:11px;font-weight:700;color:var(--blue);border:1px solid rgba(96,165,250,.4);border-radius:4px;padding:1px 6px;margin-top:3px}
.warn::before{content:"注意";flex:none;font-size:11px;font-weight:700;color:var(--amber);border:1px solid rgba(251,191,36,.4);border-radius:4px;padding:1px 6px;margin-top:3px}

/* 块：列表 */
.blist{list-style:none;margin:10px 0}
.blist li{position:relative;padding:3px 0 3px 20px}
.blist li::before{content:"▸";position:absolute;left:0;color:var(--green)}

/* 块：终端 */
.term{
  background:#0a0d13;border:1px solid var(--border);border-radius:10px;
  overflow:hidden;margin:12px 0;
}
.term-head{
  display:flex;align-items:center;gap:6px;padding:8px 12px;
  border-bottom:1px solid var(--border-soft);background:rgba(255,255,255,.015);
}
.term-dot{width:10px;height:10px;border-radius:50%}
.term-title{margin-left:6px;font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.06em}
.term-body{padding:6px 0;font-family:var(--mono);font-size:13px;line-height:1.9;overflow-x:auto}
.term-line{
  display:flex;align-items:baseline;gap:10px;padding:2px 14px;
  cursor:pointer;transition:background .12s ease;position:relative;white-space:pre;
}
.term-line:hover{background:rgba(74,222,128,.05)}
.term-line .prompt{color:var(--green);flex:none;user-select:none}
.term-line .cmd-text{color:#d7e0ee}
.term-line .cmd-desc{
  color:var(--text-3);font-family:var(--sans);font-size:12.5px;
  white-space:normal;margin-left:auto;text-align:right;padding-left:16px;
}
.copy-hint{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:var(--sans);font-size:11px;color:var(--green);
  background:#0f1a12;border:1px solid #1f3526;border-radius:5px;padding:1px 7px;
  opacity:0;pointer-events:none;transition:opacity .15s ease;
}
.term-line:hover .copy-hint{opacity:1}
.term-line.has-desc:hover .copy-hint{opacity:0}

/* 块：键帽 */
.keys-row{
  display:flex;align-items:center;gap:12px;padding:9px 4px;
  border-bottom:1px dashed var(--border-soft);cursor:pointer;border-radius:6px;
  transition:background .12s ease;
}
.keys-row:last-child{border-bottom:none}
.keys-row:hover{background:rgba(255,255,255,.02)}
.keys-row .kcombo{display:flex;align-items:center;gap:5px;flex:none;min-width:210px;flex-wrap:wrap}
kbd{
  font-family:var(--mono);font-size:12.5px;color:#dbe2f0;
  background:var(--panel-3);border:1px solid #2c3548;border-bottom-width:3px;
  border-radius:6px;padding:2px 8px;line-height:1.5;white-space:nowrap;
}
.keys-row .kalt{font-size:11.5px;color:var(--text-3)}
.keys-row .kdesc{color:var(--text-2);font-size:13.5px}

/* 块：代码 */
.codeblock{
  background:#0a0d13;border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;margin:12px 0;font-family:var(--mono);font-size:13px;
  line-height:1.75;overflow-x:auto;white-space:pre;color:#c9d4e6;cursor:pointer;
  position:relative;transition:border-color .15s ease;
}
.codeblock:hover{border-color:#31405a}
.codeblock .lang{
  position:absolute;top:8px;right:12px;font-size:10.5px;color:var(--text-3);
  letter-spacing:.1em;text-transform:uppercase;
}

/* 块：表格 */
.dtable{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}
.dtable th{
  text-align:left;font-size:12px;letter-spacing:.08em;color:var(--text-3);
  font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);
}
.dtable td{padding:9px 12px;border-bottom:1px solid var(--border-soft);color:var(--text-2);vertical-align:top}
.dtable td:first-child{color:var(--text);font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.dtable tr:last-child td{border-bottom:none}

/* 块：案例步骤 */
.steps{list-style:none;counter-reset:step;margin:14px 0 4px}
.steps li{
  counter-increment:step;position:relative;padding:0 0 22px 44px;
}
.steps li::before{
  content:counter(step);position:absolute;left:0;top:1px;
  width:26px;height:26px;border-radius:50%;
  background:var(--panel-3);border:1px solid var(--border);
  color:var(--text);font-family:var(--mono);font-size:12.5px;font-weight:600;
  display:grid;place-items:center;
}
.steps li::after{
  content:"";position:absolute;left:13px;top:30px;bottom:2px;width:1px;
  background:var(--border);
}
.steps li:last-child::after{display:none}
.steps li:last-child{padding-bottom:4px}
.step-text{color:var(--text);font-size:14.5px;padding-top:2px}

/* ============ 速查手册 ============ */
.ref-nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 11px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--text-2);font-size:13.5px;cursor:pointer;
  font-family:var(--sans);transition:all .15s ease;
}
.ref-nav-item:hover{background:var(--panel);color:var(--text)}
.ref-nav-item.active{background:var(--panel-2);border-color:var(--border);color:var(--text)}
.ref-nav-item .cat-dot{width:7px;height:7px;border-radius:2px;flex:none}
.ref-nav-item .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.ref-group{margin-bottom:36px;scroll-margin-top:84px}
.ref-group-head{
  display:flex;align-items:baseline;gap:10px;margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
}
.ref-group-head h3{font-size:16px;font-weight:700}
.ref-group-head .cnt{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.ref-entries{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;
}
.ref-card{
  background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;
  padding:12px 14px;cursor:pointer;transition:all .15s ease;position:relative;
  display:flex;flex-direction:column;gap:6px;min-width:0;
}
.ref-card:hover{border-color:#31405a;background:var(--panel-2);transform:translateY(-1px)}
.ref-card .r-name{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.5}
.ref-card .r-cmd{
  font-family:var(--mono);font-size:12.5px;color:var(--green);
  white-space:pre-wrap;word-break:break-all;line-height:1.6;
}
.ref-card .r-cmd .prompt{color:rgba(74,222,128,.55);user-select:none}
.ref-card .r-keys{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ref-card .r-desc{font-size:12.5px;color:var(--text-2);line-height:1.65}
.ref-card .r-copy{
  position:absolute;top:8px;right:10px;font-size:10.5px;color:var(--text-3);
  opacity:0;transition:opacity .15s ease;font-family:var(--mono);
}
.ref-card:hover .r-copy{opacity:1}
.ref-empty{
  text-align:center;padding:80px 20px;color:var(--text-3);
}
.ref-empty .mono{font-size:14px;color:var(--amber)}
mark{background:rgba(251,191,36,.3);color:#ffe9b8;border-radius:3px;padding:0 1px}

/* toast */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0f1a12;border:1px solid #1f3526;color:var(--green);
  font-size:13px;padding:9px 18px;border-radius:10px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:99;
  font-family:var(--mono);box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.footer-note{
  margin-top:60px;padding-top:20px;border-top:1px solid var(--border-soft);
  font-size:12px;color:var(--text-3);display:flex;gap:8px;flex-wrap:wrap;
}
.footer-note a{color:var(--blue);text-decoration:none}

/* ============ noscript 提示 ============ */
.noscript-note{
  max-width:720px;margin:80px auto;padding:24px 28px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  font-size:14px;color:var(--text-2);line-height:1.9;text-align:center;
}

/* ============ 打印（速查手册场景） ============ */
@media print{
  body{background:#fff;background-image:none;color:#111;font-size:12px}
  .topbar,.side,.copy-hint,.r-copy,.progress-pill{display:none!important}
  .container{max-width:none;padding:0}
  .view-grid{display:block}
  .unit,.ref-card,.term{break-inside:avoid;box-shadow:none;transform:none!important}
  .unit,.ref-card{background:#fff;border-color:#ccc}
  .ref-card .r-name,.ref-card .r-cmd,.term-line .cmd-text{color:#111}
  .ref-card .r-desc,.unit-body{color:#333}
  .term{background:#f6f6f6;border-color:#ccc}
}
</style>
</head>
<body>

<noscript>
  <div class="noscript-note">
    本页面为纯前端交互页面，正文与速查手册均由 JavaScript 渲染。<br>
    请在浏览器中启用 JavaScript 后刷新，即可查看完整内容。
  </div>
</noscript>

<header class="topbar">
  <div class="brand">
    <span class="logo">❯_</span>
    <span class="brand-title">Pi 完全指南</span>
    <span class="brand-sub">从安装到团队流水线</span>
  </div>
  <nav class="mode-switch" aria-label="模式切换">
    <button class="mode-btn active" id="btn-learn" type="button">学习路径</button>
    <button class="mode-btn" id="btn-ref" type="button">速查手册</button>
  </nav>
  <div class="searchbox">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa3b2" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
    <input id="search" type="text" placeholder="搜索命令、快捷键、概念…" autocomplete="off" spellcheck="false">
    <kbd>Ctrl K</kbd>
  </div>
  <button class="progress-pill" id="progress-pill" type="button" title="点击查看学习路径">学习进度 <b id="progress-num">0/0</b></button>
</header>

<main class="container">
  <section id="learn-view" data-screen-label="学习路径">
    <div class="view-grid">
      <aside class="side" id="outline"></aside>
      <div id="learn-content"></div>
    </div>
  </section>
  <section id="ref-view" data-screen-label="速查手册" hidden>
    <div class="view-grid">
      <aside class="side" id="ref-nav"></aside>
      <div id="ref-content"></div>
    </div>
  </section>
  <div class="footer-note">
    <span>内容整理自</span><a href="https://pi.dev/docs/latest/usage" target="_blank" rel="noopener">Pi 官方文档</a>
    <span>·</span><span>点击任意命令 / 快捷键即可复制</span>
    <span>·</span><span>快捷键：Ctrl+K 搜索，Esc 清除，1 / 2 切换模式</span>
  </div>
</main>

<div class="toast" id="toast">已复制</div>

<script>
"use strict";
/* ================================================================
   数据：学习路径（忠实整理自《从安装到团队流水线：一篇讲透 Pi》）
   块类型: p / list / tip / warn / cmds / keys / code / table / steps
================================================================ */
var STAGES = [
{ id:"s1", num:"01", name:"入门", color:"#4ade80",
  desc:"安装、编辑器键位与斜杠命令，完成第一次代码审查。",
  units:[
  { id:"u1", title:"安装与启动", tag:"core", blocks:[
    {t:"p", x:"全局安装后，在仓库根目录直接启动；用 <strong>--name</strong> 给会话命名，便于稍后恢复。"},
    {t:"cmds", items:[
      {c:"npm install -g --ignore-scripts @earendil-works/pi-coding-agent", d:"全局安装"},
      {c:"pi --version", d:"验证安装"},
      {c:"pi --help", d:"查看命令行选项"},
      {c:"pi", d:"启动交互会话"},
      {c:'pi --name "review auth module"', d:"启动并命名会话"},
      {c:"pi -c", d:"继续最近的会话"},
      {c:"pi -r", d:"浏览并选择会话；选择器中 Ctrl + D 删除并确认"}
    ]}
  ]},
  { id:"u2", title:"编辑器最常用的能力", tag:"core", blocks:[
    {t:"keys", items:[
      {k:"Shift+Enter", alt:"Windows Terminal：Ctrl + Enter", d:"多行输入；映射以 /hotkeys 为准"},
      {k:"Ctrl+V", alt:"Windows：Alt + V，或拖入终端", d:"附加图片；需要模型支持图片输入"},
      {k:"Ctrl+O", alt:"", d:"展开工具结果：完整输出、diff 或命令记录"}
    ]},
    {t:"tip", x:"在编辑器输入 <strong>/</strong> 打开命令补全；扩展可注册自定义命令，技能用 <strong>/skill:name</strong> 访问，提示模板通过 <strong>/模板名</strong> 展开。"}
  ]},

/* ================================================================ 渲染 */
var $ = function(s){ return document.querySelector(s); };
function h(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

var LS_KEY="pi-guide-progress-v1";
var progress={}; try{ progress=JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ progress={}; }
function saveProgress(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(progress)); }catch(e){} }

var mode="learn", query="", activeCat="all";

/* ---------- 复制 ---------- */
var toastTimer=null;
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); },1600);
}
function copyText(text){
  function done(){ toast("已复制  "+(text.length>42?text.slice(0,42)+"…":text)); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("复制失败"); }
    document.body.removeChild(ta);
  }
}

/* ---------- 键帽 ---------- */
function kbdChips(combo){
  var wrap=h("span","kcombo");
  combo.split("+").forEach(function(part,i){
    if(i>0) wrap.appendChild(h("span",null,"+")).style.cssText="color:var(--text-3);font-size:11px";
    var k=document.createElement("kbd"); k.textContent=part.trim(); wrap.appendChild(k);
  });
  return wrap;
}

/* ---------- 学习路径渲染 ---------- */
function totalUnits(){ var n=0; STAGES.forEach(function(s){ n+=s.units.length; }); return n; }
function doneUnits(){ var n=0; STAGES.forEach(function(s){ s.units.forEach(function(u){ if(progress[u.id])n++; }); }); return n; }
function stageDone(s){ var n=0; s.units.forEach(function(u){ if(progress[u.id])n++; }); return n; }

function renderOutline(){
  var box=$("#outline"); box.innerHTML="";
  STAGES.forEach(function(s){
    var g=h("div","outline-stage");
    var head=h("div","outline-stage-head");
    var dot=h("span","stage-dot"); dot.style.background=s.color;
    head.appendChild(dot);
    head.appendChild(h("span",null,s.num+" · "+s.name));
    var bar=h("span","stage-bar"); var fill=document.createElement("i");
    var pct=s.units.length? stageDone(s)/s.units.length*100 : 0;
    fill.style.width=pct+"%"; fill.style.background=s.color; bar.appendChild(fill);
    head.appendChild(bar);
    g.appendChild(head);
    s.units.forEach(function(u){
      var it=h("button","outline-item"+(progress[u.id]?" done":""));
      it.type="button"; it.dataset.unit=u.id;
      it.appendChild(h("span","tick","✓"));
      it.appendChild(h("span",null,u.title.replace(/^案例：/,"案例 · ")));
      it.addEventListener("click",function(){
        var el=document.getElementById("unit-"+u.id);
        if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
      });
      g.appendChild(it);
    });
    box.appendChild(g);
  });
  var reset=h("button","outline-reset","重置学习进度"); reset.type="button";
  reset.addEventListener("click",function(){
    progress={}; saveProgress(); renderLearn(); updatePill();
    toast("进度已重置");
  });
  box.appendChild(reset);
}

function renderBlock(b){
  if(b.t==="p") return h("p",null,b.x);
  if(b.t==="tip") return h("div","tip",h("span",null,b.x).outerHTML);
  if(b.t==="warn") return h("div","warn",h("span",null,b.x).outerHTML);
  if(b.t==="list"){
    var ul=h("ul","blist");
    b.items.forEach(function(x){ var li=h("li"); li.textContent=x; ul.appendChild(li); });
    return ul;
  }
  if(b.t==="cmds"){
    var term=h("div","term");
    var thead=h("div","term-head");
    ["#f87171","#fbbf24","#4ade80"].forEach(function(c){
      var d=h("span","term-dot"); d.style.background=c; thead.appendChild(d);
    });
    thead.appendChild(h("span","term-title", b.slash?"slash commands":"terminal"));
    term.appendChild(thead);
    var body=h("div","term-body");
    b.items.forEach(function(it){
      var line=h("div","term-line"+(it.d?" has-desc":""));
      line.appendChild(h("span","prompt", b.slash?"❯":"$"));
      var cmd=h("span","cmd-text"); cmd.textContent=it.c; line.appendChild(cmd);
      if(it.d) line.appendChild(h("span","cmd-desc",it.d));
      line.appendChild(h("span","copy-hint","复制"));
      line.addEventListener("click",function(){ copyText(it.c); });
      body.appendChild(line);
    });
    term.appendChild(body);
    return term;
  }
  if(b.t==="keys"){
    var box=h("div");
    b.items.forEach(function(it){
      var row=h("div","keys-row");
      var left=kbdChips(it.k);
      if(it.alt){ var alt=h("span","kalt",it.alt); left.appendChild(alt); }
      row.appendChild(left);
      row.appendChild(h("span","kdesc",it.d));
      row.title="点击复制快捷键";
      row.addEventListener("click",function(){ copyText(it.k); });
      box.appendChild(row);
    });
    return box;
  }
  if(b.t==="code"){
    var pre=h("pre","codeblock");
    if(b.lang) pre.appendChild(h("span","lang",b.lang));
    pre.appendChild(document.createTextNode(b.text));
    pre.title="点击复制";
    pre.addEventListener("click",function(){ copyText(b.text); });
    return pre;
  }
  if(b.t==="table"){
    var tbl=h("table","dtable");
    var tr=h("tr"); b.head.forEach(function(x){ tr.appendChild(h("th",null,x)); });
    var theadEl=document.createElement("thead"); theadEl.appendChild(tr); tbl.appendChild(theadEl);
    var tb=document.createElement("tbody");
    b.rows.forEach(function(r){
      var row=h("tr");
      r.forEach(function(c){ row.appendChild(h("td",null,c)); });
      tb.appendChild(row);
    });
    tbl.appendChild(tb);
    return tbl;
  }
  if(b.t==="steps"){
    var ol=h("ol","steps");
    b.items.forEach(function(it){
      var li=document.createElement("li");
      li.appendChild(h("div","step-text",it.x));
      if(it.code) li.appendChild(renderBlock({t:"code", lang:it.code.lang, text:it.code.text}));
      ol.appendChild(li);
    });
    return ol;
  }
  return h("div");
}

function renderLearn(){
  var box=$("#learn-content"); box.innerHTML="";
  STAGES.forEach(function(s){
    var banner=h("div","stage-banner");
    var num=h("span","stage-num",s.num);
    num.style.color=s.color; num.style.borderColor=s.color+"55"; num.style.background=s.color+"14";
    banner.appendChild(num);
    banner.appendChild(h("h2",null,s.name));
    banner.appendChild(h("p",null,s.desc));
    box.appendChild(banner);

    s.units.forEach(function(u){
      var unit=h("article","unit"+(progress[u.id]?" done":""));
      unit.id="unit-"+u.id;
      var head=h("div","unit-head");
      var chk=h("button","unit-check","✓"); chk.type="button"; chk.title="标记为已掌握";
      chk.addEventListener("click",function(){
        if(progress[u.id]) delete progress[u.id]; else progress[u.id]=1;
        saveProgress(); renderLearn(); updatePill();
        var el=document.getElementById("unit-"+u.id);
        if(el) el.scrollIntoView({block:"nearest"});
      });
      head.appendChild(chk);
      var title=h("div","unit-title",u.title);
      head.appendChild(title);
      var tag=h("span","unit-tag "+(u.tag==="case"?"tag-case":"tag-core"), u.tag==="case"?"案例":"核心");
      head.appendChild(tag);
      unit.appendChild(head);
      var body=h("div","unit-body");
      u.blocks.forEach(function(b){ body.appendChild(renderBlock(b)); });
      unit.appendChild(body);
      box.appendChild(unit);
    });
  });
  renderOutline();
}

function updatePill(){
  $("#progress-num").textContent=doneUnits()+"/"+totalUnits();
}

/* ---------- 速查手册渲染 ---------- */
function entryText(e,cat){
  return [e.n,e.c,e.k,e.code,e.d,e.kw,cat.name].filter(Boolean).join(" ").toLowerCase();
}
function hl(text,q){
  if(!q) return document.createTextNode(text);
  var frag=document.createDocumentFragment();
  var lower=text.toLowerCase(), ql=q.toLowerCase(), i=0, idx;
  while((idx=lower.indexOf(ql,i))!==-1){
    frag.appendChild(document.createTextNode(text.slice(i,idx)));
    var m=document.createElement("mark"); m.textContent=text.slice(idx,idx+ql.length);
    frag.appendChild(m); i=idx+ql.length;
  }
  frag.appendChild(document.createTextNode(text.slice(i)));
  return frag;
}
function matchQuery(e,cat){
  if(!query) return true;
  var q=query.toLowerCase().trim();
  return q.split(/\s+/).every(function(w){ return entryText(e,cat).indexOf(w)!==-1; });
}

function renderRefNav(visible){
  var nav=$("#ref-nav"); nav.innerHTML="";
  var all=h("button","ref-nav-item"+(activeCat==="all"?" active":""));
  all.type="button";
  var allDot=h("span","cat-dot"); allDot.style.background="var(--text-2)"; all.appendChild(allDot);
  all.appendChild(h("span",null,"全部"));
  var total=0; CATS.forEach(function(c){ total+= (visible[c.id]||[]).length; });
  all.appendChild(h("span","cnt",String(total)));
  all.addEventListener("click",function(){ activeCat="all"; renderRef(); });
  nav.appendChild(all);
  CATS.forEach(function(c){
    var list=visible[c.id]||[];
    if(query && list.length===0) return;
    var it=h("button","ref-nav-item"+(activeCat===c.id?" active":""));
    it.type="button";
    var dot=h("span","cat-dot"); dot.style.background=c.color; it.appendChild(dot);
    it.appendChild(h("span",null,c.name));
    it.appendChild(h("span","cnt",String(list.length)));
    it.addEventListener("click",function(){
      activeCat = activeCat===c.id ? "all" : c.id; renderRef();
    });
    nav.appendChild(it);
  });
}

function renderRef(){
  var content=$("#ref-content"); content.innerHTML="";
  var visible={};
  CATS.forEach(function(c){
    visible[c.id]=c.entries.filter(function(e){ return matchQuery(e,c); });
  });
  renderRefNav(visible);

  var any=false;
  CATS.forEach(function(c){
    if(activeCat!=="all" && activeCat!==c.id) return;
    var list=visible[c.id];
    if(list.length===0) return;
    any=true;
    var g=h("section","ref-group"); g.id="cat-"+c.id;
    var gh=h("div","ref-group-head");
    var dot=h("span","cat-dot"); dot.style.background=c.color; dot.style.alignSelf="center";
    gh.appendChild(dot);
    gh.appendChild(h("h3",null,c.name));
    gh.appendChild(h("span","cnt",list.length+" 条"));
    g.appendChild(gh);
    var grid=h("div","ref-entries");
    list.forEach(function(e){
      var card=h("div","ref-card");
      card.appendChild(h("span","r-copy","点击复制"));
      var name=h("div","r-name"); name.appendChild(hl(e.n, query.trim().split(/\s+/)[0]||""));
      card.appendChild(name);
      if(e.k){
        var ks=h("div","r-keys"); ks.appendChild(kbdChips(e.k)); card.appendChild(ks);
      }
      if(e.c){
        var cmd=h("div","r-cmd");
        var p=h("span","prompt", e.c.charAt(0)==="/" ? "❯ " : "$ ");
        cmd.appendChild(p);
        cmd.appendChild(hl(e.c, query.trim().split(/\s+/)[0]||""));
        card.appendChild(cmd);
      }
      if(e.code){
        var pre=h("pre","codeblock"); pre.style.margin="2px 0 0";
        pre.appendChild(document.createTextNode(e.code));
        pre.addEventListener("click",function(ev){ ev.stopPropagation(); copyText(e.code); });
        card.appendChild(pre);
      }
      if(e.d){
        var dd=h("div","r-desc"); dd.appendChild(hl(e.d, query.trim().split(/\s+/)[0]||""));
        card.appendChild(dd);
      }
      card.addEventListener("click",function(){
        copyText(e.c || e.k || e.code || e.d || e.n);
      });
      grid.appendChild(card);
    });
    g.appendChild(grid);
    content.appendChild(g);
  });

  if(!any){
    var empty=h("div","ref-empty");
    empty.appendChild(h("p",null,"没有匹配的内容"));
    var m=h("p"); m.appendChild(h("span","mono",'query: "'+query+'"'));
    empty.appendChild(m);
    var btn=h("button","outline-reset","清除搜索"); btn.type="button"; btn.style.width="auto"; btn.style.margin="16px auto 0"; btn.style.padding="6px 18px";
    btn.addEventListener("click",function(){ setQuery(""); $("#search").focus(); });
    empty.appendChild(btn);
    content.appendChild(empty);
  }
}

/* ---------- 模式切换与搜索 ---------- */
function setMode(m){
  mode=m;
  $("#btn-learn").classList.toggle("active", m==="learn");
  $("#btn-ref").classList.toggle("active", m==="ref");
  $("#learn-view").hidden = m!=="learn";
  $("#ref-view").hidden = m!=="ref";
  syncHash();
  window.scrollTo({top:0});
}
function setQuery(q){
  query=q; $("#search").value=q;
  if(mode!=="ref" && q){ setMode("ref"); }
  if(mode==="ref") renderRef();
  syncHash();
}
function syncHash(){
  var hs = mode==="ref" ? "#ref" : "#learn";
  if(mode==="ref" && query) hs += "?q="+encodeURIComponent(query);
  try{ history.replaceState(null,"",hs); }catch(e){}
}
function parseHash(){
  var hs=location.hash||"";
  if(hs.indexOf("#ref")===0){
    var qi=hs.indexOf("?q=");
    if(qi!==-1){ query=decodeURIComponent(hs.slice(qi+3)); $("#search").value=query; }
    setMode("ref"); renderRef();
  }
}

$("#btn-learn").addEventListener("click",function(){ setMode("learn"); });
$("#btn-ref").addEventListener("click",function(){ setMode("ref"); });
$("#progress-pill").addEventListener("click",function(){ setMode("learn"); });
$("#search").addEventListener("input",function(ev){ setQuery(ev.target.value); });
$("#search").addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){ setQuery(""); ev.target.blur(); }
});
document.addEventListener("keydown",function(ev){
  var typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName || "");
  if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="k"){ ev.preventDefault(); $("#search").focus(); $("#search").select(); }
  else if(ev.key==="/" && !typing){ ev.preventDefault(); $("#search").focus(); }
  else if(ev.key==="1" && !typing){ setMode("learn"); }
  else if(ev.key==="2" && !typing){ setMode("ref"); }
});

/* ---------- 学习模式滚动高亮 ---------- */
var scrollTick=false;
window.addEventListener("scroll",function(){
  if(scrollTick||mode!=="learn") return;
  scrollTick=true;
  requestAnimationFrame(function(){
    scrollTick=false;
    var current=null;
    document.querySelectorAll(".unit").forEach(function(u){
      if(u.getBoundingClientRect().top<120) current=u.id.replace("unit-","");
    });
    document.querySelectorAll(".outline-item").forEach(function(it){
      var isCurrent = it.dataset.unit===current;
      it.classList.toggle("current", isCurrent);
      if(isCurrent) it.setAttribute("aria-current","location");
      else it.removeAttribute("aria-current");
    });
  });
